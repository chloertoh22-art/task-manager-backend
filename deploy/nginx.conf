# Nginx reverse proxy for the Task Manager API.
# Nginx receives web traffic on port 80/443 and forwards it to Node.js on port 3000.
#
# Install (see DEPLOYMENT-GUIDE.md, Step 9):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/task-api
#   sudo sed -i "s/YOUR_API_HOST/$API_HOST/" /etc/nginx/sites-available/task-api
#   sudo ln -sf /etc/nginx/sites-available/task-api /etc/nginx/sites-enabled/task-api
#
# Afterwards, certbot adds the HTTPS (port 443) settings to this file automatically.

server {
    listen 80;
    server_name YOUR_API_HOST;   # e.g. 13-250-1-2.sslip.io

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
